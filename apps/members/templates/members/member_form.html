{% extends "base.html" %}
{% block title %}{% if member %}Edit member{% else %}Add member{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h1 class="h3 mb-3">{% if member %}Edit {{ member.name }}{% else %}Add a member{% endif %}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-outline-secondary" href="{% if member %}{{ member.get_absolute_url }}{% else %}{% url 'member_list' %}{% endif %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
