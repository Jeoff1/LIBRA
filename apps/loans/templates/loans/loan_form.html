{% extends "base.html" %}
{% block title %}Edit loan{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h1 class="h3 mb-3">Change due date</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <p class="mb-3"><strong>{{ loan.book.title }}</strong><br>
          lent to {{ loan.member }} on {{ loan.borrow_date }}</p>
        <form method="post" novalidate>
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next_url }}">
          {% include "includes/form_fields.html" %}
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-outline-secondary" href="{{ next_url }}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
