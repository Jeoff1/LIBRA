{% if book.cover_url %}<img class="cover cover-{{ size|default:'sm' }}" src="{{ book.cover_url }}" alt="Cover of {{ book.title }}" loading="lazy">{% else %}<div class="cover cover-{{ size|default:'sm' }} cover-ph" role="img" aria-label="{{ book.title }} (no cover)"><span class="ph-title">{{ book.title|truncatechars:60 }}</span><span class="ph-initial">{{ book.title|first|upper }}</span></div>{% endif %}
