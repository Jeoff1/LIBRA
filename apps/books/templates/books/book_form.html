{% extends "base.html" %}
{% block title %}{% if book %}Edit book{% else %}Add book{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="h3 mb-3">{% if book %}Edit “{{ book.title }}”{% else %}Add a book{% endif %}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-outline-secondary" href="{% if book %}{{ book.get_absolute_url }}{% else %}{% url 'book_list' %}{% endif %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
