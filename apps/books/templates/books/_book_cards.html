<div class="row row-cols-2 row-cols-sm-3 row-cols-md-5 g-3 g-lg-4">
  {% for book in books %}
  <div class="col">
    <a class="book-card" href="{{ book.get_absolute_url }}">
      {% include "books/_cover.html" with size="fluid" %}
      <div class="book-card-title">{{ book.title|truncatechars:55 }}</div>
      <div class="book-card-author">{{ book.authors|truncatechars:40 }}</div>
      <div class="mt-1">
        {% if book.available_copies %}<span class="badge text-bg-success">{{ book.available_copies }} available</span>
        {% else %}<span class="badge text-bg-secondary">All on loan</span>{% endif %}
      </div>
    </a>
  </div>
  {% endfor %}
</div>
