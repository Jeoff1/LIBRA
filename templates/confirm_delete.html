{% extends "base.html" %}
{% block title %}Delete {{ kind }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-danger">
      <div class="card-body">
        <h1 class="h4">Delete {{ kind }}?</h1>
        <p class="mb-1">You are about to delete <strong>{{ object }}</strong>.</p>
        {% if warning %}<p class="text-danger mb-1">{{ warning }}</p>{% endif %}
        <p class="text-body-secondary">This cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger" type="submit">Yes, delete</button>
          <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
